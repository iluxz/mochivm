name: build-and-smoke

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: format check
        run: cargo fmt --check
      - name: build
        run: cargo build --release --target x86_64-unknown-uefi
      - uses: actions/upload-artifact@v4
        with:
          name: mochivm-efi
          path: target/x86_64-unknown-uefi/release/mochivm.efi

  smoke:
    needs: build
    # GitHub-hosted runners have no /dev/kvm (no nested virtualization), so
    # this is a boot-only check unless the repo ever gets a KVM-capable runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - run: cargo build --release --target x86_64-unknown-uefi
      - name: install qemu + ovmf + mtools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf mtools
      - name: run smoke test
        run: bash scripts/smoke.sh
      - name: upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: serial.log

  manager:
    # Build the mochivm-manager gui (qemu backend + serial console). The
    # windows artifact is the one zum actually runs; linux keeps the build
    # honest cross-platform.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: format check
        run: cargo fmt --check
        working-directory: manager
      - name: test
        run: cargo test --release
        working-directory: manager
      - name: build
        run: cargo build --release
        working-directory: manager
      - name: upload windows exe
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mochivm-manager-windows
          path: manager/target/release/mochivm-manager.exe
