name: build-and-smoke

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: format check
        run: cargo fmt --check
      - name: build
        run: cargo build --release --target x86_64-unknown-uefi
      - uses: actions/upload-artifact@v4
        with:
          name: mochivm-efi
          path: target/x86_64-unknown-uefi/release/mochivm.efi

  smoke:
    needs: build
    # 16-core runners expose /dev/kvm (nested virt); default runners don't.
    runs-on: ubuntu-latest-16-cores
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - run: cargo build --release --target x86_64-unknown-uefi
      - name: install qemu + ovmf + mtools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf mtools
      - name: run smoke test
        run: bash scripts/smoke.sh
      - name: upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: serial.log
